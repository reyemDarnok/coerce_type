[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "coerce_type"
dynamic = ["version"]
description = "A library providing tools to enforce type hints."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/coerce_type"]